name: Build APK

# push 到 main 就自动出包；也可以在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里没有 gradle-wrapper.jar（二进制不方便手写），
      # 所以这里直接装 Gradle 本体，不走 ./gradlew。
      # 等你在电脑上用 Android Studio 打开过一次、生成了 wrapper，
      # 可以把 gradle-version 那行删掉，改用 ./gradlew assembleDebug。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 产物在 Actions 运行页面的 Artifacts 区，手机浏览器可以直接下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sopcam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
